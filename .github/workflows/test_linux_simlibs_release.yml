name: Linux SimLibs Release Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test_linux_simlibs_release.yml"
      - "CMakeLists.txt"
      - "build.cmd"
      - "build.sh"
      - "build_linux.mk"
      - "setup_linux_dev_tools.sh"
      - "core_sim/**"
      - "mavlinkcom/**"
      - "physics/**"
      - "rendering/**"
      - "samples/**"
      - "simserver/**"
      - "tools/**"
      - "unity/**"
      - "vehicle_apis/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test_linux_simlibs_release.yml"
      - "CMakeLists.txt"
      - "build.cmd"
      - "build.sh"
      - "build_linux.mk"
      - "setup_linux_dev_tools.sh"
      - "core_sim/**"
      - "mavlinkcom/**"
      - "physics/**"
      - "rendering/**"
      - "samples/**"
      - "simserver/**"
      - "tools/**"
      - "unity/**"
      - "vehicle_apis/**"

jobs:
  test-simlibs-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Linux development tools
        shell: bash
        run: |
          chmod +x ./setup_linux_dev_tools.sh
          ./setup_linux_dev_tools.sh

      - name: Build SimLibs
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh simlibs_release

      - name: Test SimLibs
        shell: bash
        run: |
          ./build.sh test_simlibs_release
