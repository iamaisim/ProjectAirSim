name: macOS SimLibs Release Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - main_public
  push:
    branches:
      - main
      - main_public
    paths:
      - ".github/workflows/test_macos_simlibs_release.yml"
      - "CMakeLists.txt"
      - "build.sh"
      - "build_macos.mk"
      - "setup_macos_dev_tools.sh"
      - "core_sim/**"
      - "mavlinkcom/**"
      - "physics/**"
      - "rendering/**"
      - "samples/**"
      - "simserver/**"
      - "tools/**"
      - "unity/**"
      - "vehicle_apis/**"

permissions:
  contents: read

jobs:
  test-simlibs-release:
    name: macOS SimLibs Release
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up macOS development tools
        shell: bash
        run: |
          chmod +x ./setup_macos_dev_tools.sh
          ./setup_macos_dev_tools.sh

      - name: Show toolchain versions
        shell: bash
        run: |
          uname -a
          clang --version
          cmake --version
          ninja --version
          "$(brew --prefix openssl@3)/bin/openssl" version
          brew list --versions zlib

      - name: Build SimLibs
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh simlibs_release

      - name: Test SimLibs
        id: tests
        shell: bash
        run: ./build.sh test_simlibs_release

      - name: Repeat publication teardown tests
        shell: bash
        run: |
          ctest --test-dir build/macos/Release -C Release --output-on-failure \
            --repeat until-fail:100 \
            -R '^(PhysicsPublication\.|(MatlabPhysicsBody|UnrealPhysicsBody)\.WriteRobotData$|FastPhysicsBody\.ReadWriteRobotData$)'
