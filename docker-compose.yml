# Project AirSim dev container: SimLibs + Unreal Engine build/run environment.
#
# Host paths are configured via a .env file (not committed -- see .env.example for the
# template with defaults). PROJECTAIRSIM_HOST_PATH defaults to "." since this file lives at
# the repo root, so the common case needs no configuration at all. UE_ROOT_HOST_PATH has no
# universal default (engine checkout location/version varies per machine) and must be set in
# .env or the environment before running.
#
# Usage:
#   cp .env.example .env   # edit UE_ROOT_HOST_PATH to point at your Unreal Engine checkout
#   docker compose build
#   docker compose run --rm projectairsim-dev
#
# Inside the container:
#   cd $UE_ROOT && ./Setup.sh --force && ./GenerateProjectFiles.sh   # one-time, first run only
#   cd /workspace/ProjectAirSim
#   ./build.sh simlibs_debug
#   ./build.sh blocks_debuggame
#   $UE_ROOT/Engine/Binaries/Linux/UnrealEditor-Linux-DebugGame \
#     /workspace/ProjectAirSim/unreal/Blocks/Blocks.uproject
#
# Before launching the Editor with a window, on the HOST run once per session:
#   xhost +local:docker

services:
  projectairsim-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: projectairsim-dev
    container_name: projectairsim-dev
    hostname: projectairsim-dev
    stdin_open: true
    tty: true
    privileged: true
    cap_add:
      - SYS_PTRACE
    network_mode: host
    shm_size: "4gb"

    # GPU passthrough (NVIDIA Container Toolkit). "graphics,display" are required for
    # Vulkan/UnrealEditor rendering; "compute" is needed if you later use the
    # torch/onnxruntime-gpu autonomy stack.
    gpus: all
    devices:
      - /dev/dri
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display,video
      - DISPLAY=${DISPLAY}
      - UE_ROOT=/workspace/UnrealEngine

    volumes:
      # Host paths come from .env (see .env.example). The ProjectAirSim repo defaults to "."
      # (this file's own directory); the Unreal Engine checkout has no safe default and must
      # be set explicitly via UE_ROOT_HOST_PATH.
      - ${PROJECTAIRSIM_HOST_PATH:-.}:/workspace/ProjectAirSim
      - ${UE_ROOT_HOST_PATH:?Set UE_ROOT_HOST_PATH in .env to your Unreal Engine checkout path (see .env.example)}:/workspace/UnrealEngine
      # X11/XWayland socket for the Editor GUI window
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Vulkan ICD/layer search paths some drivers expect on the host side too
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro

    working_dir: /workspace/ProjectAirSim
